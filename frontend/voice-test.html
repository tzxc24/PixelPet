<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>小星 · 自然声音对比</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23edaa48' d='M14 2h4v8h10v6h-6v14l-6-6-6 6V16H4v-6h10z'/%3E%3C/svg%3E"><link rel="stylesheet" href="/static/css/style.css"><link rel="stylesheet" href="/static/css/v1.css"><script src="/static/js/auth.js" defer></script><script src="/static/js/audio-player.js" defer></script><script src="/static/js/voice-test.js" defer></script></head>
<body><div class="page voice-test-page"><header class="header"><a class="brand" href="/">✦ PixelPet</a><a href="/">返回小星的房间</a></header><main><div class="intro"><div><span class="eyebrow">FIND A VOICE FOR OUR LITTLE STAR</span><h1>听听小星的自然声音<span>。</span></h1><p>同一句话、相同参数，找到最喜欢的陪伴感。</p></div></div>
<section class="workbench"><p id="preview-phrase">你好呀，我是小星！今天也很开心见到你，嘿嘿，要不要陪我聊聊天？</p><div id="test-controls" class="voice-test-controls"><label>语速 <output id="test-rate-value">+0%</output><input id="test-rate" type="range" min="0.8" max="1.2" step="0.01" value="1"></label><label>音量 <output id="test-volume-value">100%</output><input id="test-volume" type="range" min="0" max="1" step="0.05" value="1"></label><label>音高微调 <output id="test-pitch-value">+0 Hz</output><input id="test-pitch" type="range" min="-12" max="12" step="1" value="0"></label></div><div id="voice-cards" class="voice-cards" aria-label="自然声音列表"></div><div class="voice-controls"><button id="test-stop" type="button">停止播放</button><button id="test-reset" type="button">恢复默认参数</button></div><p class="memory-hint">提供方固定为 Edge 在线自然语音。试听不会降级到离线声音；回复文本将发送给 Microsoft，无需 API Key。此页参数仅用于试听。</p></section>
<section class="workbench" aria-label="真实播放信息"><h2>真实播放信息</h2><p id="test-status" role="status">请选择声音试听。</p><dl class="audio-metadata"><dt>状态</dt><dd id="test-state">IDLE</dd><dt>提供方</dt><dd id="test-provider">edge（待播放）</dd><dt>声音</dt><dd id="test-voice">—</dd><dt>参数</dt><dd id="test-params">语速 +0% · 音高 +0 Hz · 音量 +0%</dd><dt>合成耗时</dt><dd id="test-ms">—</dd><dt>音频</dt><dd id="test-format">WAV · 等待真实响应</dd></dl></section></main></div></body></html>
